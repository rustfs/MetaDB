syntax = "proto3";

package metadb.v1;

import "metadb/v1/common.proto";

message RegisterNodeRequest {
  uint64 cell_id = 1;
  uint64 node_id = 2;
  string grpc_addr = 3;
  // 16-byte big-endian node instance id. Empty is rejected once a node id is bound.
  bytes instance_id = 4;
}

message RegisterNodeResponse {
  ErrorDetailProto error = 1;
}

message ShardHeartbeatStatsProto {
  ShardDescriptorProto descriptor = 1;
  uint64 approximate_bytes = 2;
  uint64 qps = 3;
  bool unsplittable_jumbo = 4;
  uint64 dominant_pid = 5;
  uint64 safe_purge_index = 6;
}

message StoreHeartbeatRequest {
  uint64 cell_id = 1;
  uint64 node_id = 2;
  uint64 disk_free_bytes = 3;
  // Annotations only. The server does not install these descriptors as routes.
  repeated ShardHeartbeatStatsProto shards = 4;
  // Required. Zero is rejected. A lower sequence than the stored one is rejected.
  // The same sequence and the same disk/shard annotation is an idempotent replay.
  uint64 monotonic_seq = 5;
  // When false, disk_free_bytes is not a measurement and is stored as unknown.
  bool disk_free_known = 6;
  // 16-byte big-endian instance id. Required only when that node id is already
  // bound to an instance. Empty does not authenticate the caller. This is not a
  // shard epoch and does not schedule placement.
  bytes instance_id = 7;
  // 16-byte big-endian heartbeat-file generation. Required and non-zero.
  // A receiver with no row accepts this generation's current sequence.
  // The same generation still rejects jumps above 64. This is not a shard epoch.
  bytes observation_generation = 8;
}

message StoreHeartbeatResponse {
  ErrorDetailProto error = 1;
}

message GetRoutesRequest {
  uint64 cell_id = 1;
}

// One move stored on a local placement row. Not a route and not a shard epoch.
message PlacementMoveProto {
  // 1 = leadership_transferred, 2 = voter_replaced. Zero is not a stored move.
  uint32 kind = 1;
  uint64 shard_id = 2;
  // Leadership target, or the voter that was added.
  uint64 node_id = 3;
  // Set for voter_replaced. Zero for a leadership move.
  uint64 removed_node = 4;
}

// One `CELL_CONTROL_PLANE` placement row hosted by this process.
// It is not installed as a route. A remote cell does not contribute a row.
message PlacementRecordProto {
  uint64 cell_id = 1;
  uint64 shard_id = 2;
  uint64 dominant_pid = 3;
  uint64 dedicated_node = 4;
  // 1 recorded, 2 leader_on_dedicated, 3 dedicated_not_shared, 4 blocked.
  // Zero is not a stored phase.
  uint32 phase = 5;
  string phase_name = 6;
  string blocked_reason = 7;
  repeated PlacementMoveProto committed_moves = 8;
  uint64 last_transfer_attempt_unix_ms = 9;
  uint64 last_replace_attempt_unix_ms = 10;
  uint64 updated_unix_ms = 11;
}

message GetRoutesResponse {
  ErrorDetailProto error = 1;
  repeated ShardDescriptorProto shards = 2;
  // 16-byte big-endian cluster id. Empty means this process has not adopted one.
  bytes cluster_id = 3;
  // Local placement rows only. Empty for a remote cell. Not a route list.
  repeated PlacementRecordProto placements = 4;
  // This process's build flag. False means maintenance does not call transfer_leader.
  // It is not a measurement of a remote cell.
  bool automatic_leadership_transfer_enabled = 5;
}

message AllocateIdBlockRequest {
  bytes request_uuid_be = 1;
  // 1 = FileInode, 2 = DirInode, 3 = FileId, 4 = ShardId
  uint32 id_kind = 2;
  uint64 count = 3;
  uint64 preferred_shard_id = 4;
}

message AllocateIdBlockResponse {
  ErrorDetailProto error = 1;
  uint64 start_id = 2;
  uint64 count = 3;
}

message AllocSplitPlanRequest {
  bytes request_uuid_be = 1;
  uint64 cell_id = 2;
  uint64 parent_shard_id = 3;
  bytes split_key = 4;
  uint64 target_version = 5;
}

message AllocSplitPlanResponse {
  ErrorDetailProto error = 1;
  uint64 child_shard_id = 2;
}

message ActivateSplitRequest {
  uint64 cell_id = 1;
  ShardDescriptorProto parent_descriptor = 2;
  ShardDescriptorProto child_descriptor = 3;
}

message ActivateSplitResponse {
  ErrorDetailProto error = 1;
}

message AcquireDirRenameLeaseRequest {
  bytes request_uuid_be = 1;
  uint64 moved_dir_id = 2;
  uint64 ttl_ms = 3;
}

message AcquireDirRenameLeaseResponse {
  ErrorDetailProto error = 1;
  uint64 rename_fence_token = 2;
  uint64 expire_hlc = 3;
}

message ReleaseDirRenameLeaseRequest {
  uint64 rename_fence_token = 1;
}

message ReleaseDirRenameLeaseResponse {
  ErrorDetailProto error = 1;
}

message TriggerShardSplitRequest {
  uint64 shard_id = 1;
}

message TriggerShardSplitResponse {
  ErrorDetailProto error = 1;
  bool split_executed = 2;
  uint64 child_shard_id = 3;
  // Local placement row for this shard after the call, when one exists.
  // A jumbo candidate can set this while split_executed stays false.
  PlacementRecordProto placement = 4;
  // This process's build flag. A placement row is not a leadership transfer.
  bool automatic_leadership_transfer_enabled = 5;
}

message EnableDualModeSplitRequest {
  uint64 shard_id = 1;
  uint64 dominant_pid = 2;
  string split_name = 3;
}

message EnableDualModeSplitResponse {
  ErrorDetailProto error = 1;
}

message ScaleShardReplicasRequest {
  uint64 cell_id = 1;
  uint32 target_voters = 2;
  // When non-zero, this node is added even if `target_voters` is already met.
  uint64 ensure_node_id = 3;
}

message ScaleShardReplicasResponse {
  ErrorDetailProto error = 1;
  uint32 upgraded_shards = 2;
}

message RegisterCellRequest {
  uint64 cell_id = 1;
  bytes start_key = 2;
  bytes end_key = 3;
  repeated string cell_manager_endpoints = 4;
}

message RegisterCellResponse {
  ErrorDetailProto error = 1;
}

service ControlPlaneService {
  rpc RegisterNode(RegisterNodeRequest) returns (RegisterNodeResponse);
  rpc StoreHeartbeat(StoreHeartbeatRequest) returns (StoreHeartbeatResponse);
  rpc GetRoutes(GetRoutesRequest) returns (GetRoutesResponse);
  rpc AllocateIdBlock(AllocateIdBlockRequest) returns (AllocateIdBlockResponse);
  rpc AllocSplitPlan(AllocSplitPlanRequest) returns (AllocSplitPlanResponse);
  rpc ActivateSplit(ActivateSplitRequest) returns (ActivateSplitResponse);
  rpc AcquireDirRenameLease(AcquireDirRenameLeaseRequest) returns (AcquireDirRenameLeaseResponse);
  rpc ReleaseDirRenameLease(ReleaseDirRenameLeaseRequest) returns (ReleaseDirRenameLeaseResponse);
  rpc TriggerShardSplit(TriggerShardSplitRequest) returns (TriggerShardSplitResponse);
  rpc EnableDualModeSplit(EnableDualModeSplitRequest) returns (EnableDualModeSplitResponse);
  rpc ScaleShardReplicas(ScaleShardReplicasRequest) returns (ScaleShardReplicasResponse);
  rpc RegisterCell(RegisterCellRequest) returns (RegisterCellResponse);
}
