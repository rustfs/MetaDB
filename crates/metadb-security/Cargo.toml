[package]
name = "metadb-security"
description = "TLS 1.3 transport for MetaDB using rustls and the ring provider. Method RBAC is not installed."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# Test certificate minting. Not enabled in the metadbd binary.
testing = ["dep:const-oid", "dep:ed25519-dalek", "dep:x509-cert"]

[dependencies]
http = "1"
hyper-util = { version = "0.1.21", features = ["tokio"] }
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring"] }
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tonic = { workspace = true }
tower = { version = "0.5", features = ["util"] }
x509-parser = { version = "0.16.0", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

const-oid = { version = "0.9", optional = true, features = ["db"] }
ed25519-dalek = { version = "2.1", optional = true, default-features = false, features = ["std", "pem", "pkcs8"] }
x509-cert = { version = "0.2.5", optional = true, default-features = false, features = ["builder", "pem", "std"] }

[dev-dependencies]
const-oid = { version = "0.9", features = ["db"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["std", "pem", "pkcs8"] }
x509-cert = { version = "0.2.5", default-features = false, features = ["builder", "pem", "std"] }
