[package]
name = "metadb-server"
description = "Unified MetaDB engine, metadbd daemon, and metadb-ctl CLI supporting Single-Node All-in-One to Multi-Cell Distributed Clusters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "metadbd"

[[bin]]
name = "metadbd"
path = "src/bin/metadbd.rs"

[[bin]]
name = "metadb-ctl"
path = "src/bin/metadb-ctl.rs"

[dependencies]
metadb-core = { workspace = true }
metadb-proto = { workspace = true }
metadb-storage = { workspace = true }
metadb-raft = { workspace = true }
metadb-tx = { workspace = true }
metadb-cluster = { workspace = true }
metadb-proxy = { workspace = true }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = "1.0.154"
tokio = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
wincode = { workspace = true }
openraft = { workspace = true }
metadb-core = { workspace = true }
metadb-cluster = { workspace = true }
metadb-tx = { workspace = true }
metadb-raft = { workspace = true }
metadb-storage = { workspace = true }
metadb-proto = { workspace = true }
metadb-proxy = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
