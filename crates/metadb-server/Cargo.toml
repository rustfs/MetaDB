[package]
name = "metadb-server"
description = "Unified MetaDB engine, metadbd daemon, and metadb-ctl CLI supporting Single-Node All-in-One to Multi-Cell Distributed Clusters"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
default-run = "metadbd"

[[bin]]
name = "metadbd"
path = "src/bin/metadbd.rs"

[[bin]]
name = "metadb-ctl"
path = "src/bin/metadb-ctl.rs"

[dependencies]
metadb-core = { path = "../metadb-core" }
metadb-proto = { path = "../metadb-proto" }
metadb-storage = { path = "../metadb-storage" }
metadb-raft = { path = "../metadb-raft" }
metadb-tx = { path = "../metadb-tx" }
metadb-cluster = { path = "../metadb-cluster" }
metadb-proxy = { path = "../metadb-proxy" }
bincode = { workspace = true }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
clap = { workspace = true }
serde = { workspace = true }
serde_json = "1"
tokio = { workspace = true }
tokio-stream = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
openraft = { workspace = true }
metadb-core = { path = "../metadb-core" }
metadb-cluster = { path = "../metadb-cluster" }
metadb-tx = { path = "../metadb-tx" }
metadb-raft = { path = "../metadb-raft" }
metadb-storage = { path = "../metadb-storage" }
metadb-proto = { path = "../metadb-proto" }
metadb-proxy = { path = "../metadb-proxy" }
tokio-stream = { workspace = true }
tonic = { workspace = true }
