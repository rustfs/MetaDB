# Initial reporting config for `.github/workflows/dependency-audit.yml`.
# This is not a production-grade supply-chain policy.
#
# `unmaintained = "all"` and `unsound = "workspace"` make those advisory classes
# errors. Vulnerability advisories are always errors. Yanked crates warn.
# Duplicate versions warn via `[bans]`.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
unmaintained = "all"
unsound = "workspace"
yanked = "warn"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
# Owner decision 2026-11-20 11:17 Asia/Shanghai: TLS uses rustls with the
# maintained ring provider only. ring's bundled C and assembly are accepted
# for that TLS stack and for no other crate or module. These are crate-scoped
# exceptions, not a blanket ISC allow. aws-lc-rs and aws-lc-sys are not
# allowed. Do not add another crate to this list without a new owner decision.
# Resolved with this lockfile: ring 0.17.14 (Apache-2.0 AND ISC),
# rustls-webpki 0.103.17 (ISC), untrusted 0.9.0 (ISC).
exceptions = [
    { allow = ["Apache-2.0", "ISC"], name = "ring" },
    { allow = ["ISC"], name = "rustls-webpki" },
    { allow = ["ISC"], name = "untrusted" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
