# Initial reporting config for `.github/workflows/dependency-audit.yml`.
# This is not a production-grade supply-chain policy.
#
# `unmaintained = "all"` and `unsound = "workspace"` make those advisory classes
# errors. Vulnerability advisories are always errors. Yanked crates warn.
# Duplicate versions warn via `[bans]`.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
unmaintained = "all"
unsound = "workspace"
yanked = "warn"
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    # rustls verifies certificates with rustls-webpki. That crate and its
    # parser `untrusted` are ISC. ISC is not in the allow list above. These
    # exceptions are crate-specific. They do not allow every ISC crate, and
    # they do not allow ring (Apache-2.0 AND ISC), which this workspace does
    # not enable. There is no Apache-2.0 or MIT WebPKI verifier in the rustls
    # 0.23 stack.
    { allow = ["ISC"], name = "rustls-webpki" },
    { allow = ["ISC"], name = "untrusted" },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
