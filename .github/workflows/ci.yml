name: CI

on:
  push:
    branches: ["main", "**"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-check-lint-test:
    name: Format, Clippy & Test (locked toolchain)
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Protobuf Compiler (protoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Setup pinned Rust toolchain (rust-toolchain.toml, 1.100.0)
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy with warnings denied
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run full workspace test suite
        run: cargo test --workspace --locked

      - name: Reject ignored tests that have no reason
        run: |
          # Match a bare attribute only. Mentions inside comments, and
          # #[ignore = "reason"], are allowed.
          if grep -R -n -E '^[[:space:]]*#\[ignore\][[:space:]]*(//.*)?$' --include='*.rs' crates; then
            echo 'bare #[ignore] is not allowed; use #[ignore = "why CI skips this test"]'
            exit 1
          fi
